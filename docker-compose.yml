# Local GeoServer + PostGIS for developing and testing the plugin.
#
#   docker compose up -d       # first start pulls ~1.5 GB, then ~40 s to boot
#   docker compose ps          # wait for gsm-geoserver to be "healthy"
#   docker compose down -v     # stop and discard the data
#
# Point the plugin at http://localhost:8080/geoserver with admin / geoserver
# (Settings → Options → GeoServer Manager).
#
# The server comes up with GeoServer's demo data: five workspaces and their
# layers, styles, coverage stores and layer groups, so the list views, search
# and pagination have something real to show, and the upcoming tabs have
# resources to list. For the empty first-run state instead:
#
#     docker compose down -v && SKIP_DEMO_DATA=true docker compose up -d
#
# The -v matters: the demo data is unpacked only when the data-dir volume is
# created, so flipping the flag on an existing volume changes nothing.
#
# PostGIS is here because "PostGIS" is the plugin's main datastore type:
# without a reachable database a created store looks fine but serves nothing,
# and the edit-merge behaviour (pool settings, "Loose bbox", "Expose primary
# keys") cannot be exercised at all. In the plugin's datastore form use
#
#     host postgis   port 5432   database/user/password  geoserver
#
# Those are container-to-container values: GeoServer resolves "postgis" on the
# compose network, which is why the database port is not published to the host.
#
# Throwaway credentials for a local sandbox. Do not reuse them anywhere.

services:
  geoserver:
    image: docker.osgeo.org/geoserver:2.28.5
    container_name: gsm-geoserver
    ports:
      - "8080:8080"
    environment:
      # The image ships GeoServer's default admin/geoserver; setting them
      # explicitly documents the credentials and lets you change them
      # (/opt/handle_geoserver_admin_credentials.sh applies these at startup).
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: geoserver
      SKIP_DEMO_DATA: "${SKIP_DEMO_DATA:-false}"
      # A PMTiles *datastore config* can be created on vanilla GeoServer, but
      # serving from it needs the community module. Uncomment to install it;
      # it downloads at every container start, so leave it off unless needed.
      # INSTALL_EXTENSIONS: "true"
      # COMMUNITY_EXTENSIONS: "pmtiles"
    volumes:
      - geoserver-data:/opt/geoserver_data
    depends_on:
      postgis:
        condition: service_healthy
    healthcheck:
      # The plugin's own status-bar call, so "healthy" means "the plugin can
      # talk to it" rather than "Tomcat is up".
      test:
        - CMD-SHELL
        - >-
          curl -fsS -u admin:geoserver
          http://localhost:8080/geoserver/rest/about/version.json > /dev/null
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  postgis:
    image: postgis/postgis:16-3.4
    container_name: gsm-postgis
    environment:
      POSTGRES_DB: geoserver
      POSTGRES_USER: geoserver
      POSTGRES_PASSWORD: geoserver
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geoserver -d geoserver"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  geoserver-data:
  postgis-data:
