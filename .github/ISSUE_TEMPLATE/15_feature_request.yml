name: Feature request
description: Suggest a feature.
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the request.

  - type: textarea
    id: what
    attributes:
      label: Feature description
      description: What you want to do, and what the plugin does today instead.
    validations:
      required: true

  - type: textarea
    id: web-ui
    attributes:
      label: How the GeoServer web interface does it today
      description: The page and the fields, if the web interface has them. That is where the plugin starts.

  - type: textarea
    id: Additional
    attributes:
      label: Additional context
      description: |
        Anything else, screenshots included.
