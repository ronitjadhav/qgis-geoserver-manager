ci-cd:
  - changed-files:
      - any-glob-to-any-file: .github/**

dependencies:
  - changed-files:
    - any-glob-to-any-file:
        - requirements/*.txt
        - requirements.txt

documentation:
  - changed-files:
    - any-glob-to-any-file:
        - docs/**
        - requirements/documentation.txt

packaging:
  - changed-files:
    - any-glob-to-any-file:
      - requirements/packaging.txt
      - setup.py

quality:
  - changed-files:
    - any-glob-to-any-file:
      - tests/**/*

tooling:
  - changed-files:
    - any-glob-to-any-file:
        - .pre-commit-config.yaml
        - setup.cfg

UI:
  - changed-files:
    - any-glob-to-any-file:
        - geoserver_manager/**/*.ui
        - geoserver_manager/gui/**
