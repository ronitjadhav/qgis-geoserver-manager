name: "🌍 Live GeoServer"

# The other suites run against fakes: fast, but blind to what a GeoServer
# release changes. This one drives every tab against the real thing, the
# latest 2.x and 3.x releases of GeoServer and of GeoServer Cloud (both its
# catalogs), so a new release that breaks the plugin shows here within a week.

on:
  schedule:
    - cron: "17 4 * * 1"

  # before a release, or to try other GeoServer versions
  workflow_dispatch:
    inputs:
      versions:
        description: "GeoServer image tags, separated by spaces. Empty: the latest 2.x and 3.x releases."
        required: false
        default: ""
      cloud_versions:
        description: "GeoServer Cloud versions, separated by spaces. Empty: the latest 2.x and 3.x releases."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.pick.outputs.versions }}

    steps:
      - name: Pick the GeoServer versions
        id: pick
        env:
          WANTED: ${{ inputs.versions }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, re, urllib.request

          wanted = os.environ.get("WANTED", "").split()
          if not wanted:
              url = "https://docker.osgeo.org/v2/geoserver/tags/list"
              with urllib.request.urlopen(url, timeout=60) as answer:
                  tags = json.load(answer)["tags"]
              releases = [
                  tuple(map(int, tag.split(".")))
                  for tag in tags
                  if re.fullmatch(r"\d+\.\d+\.\d+", tag)
              ]
              # A major without a release yet (or no more) shrinks the matrix.
              wanted = []
              for major in (2, 3):
                  latest = max((v for v in releases if v[0] == major), default=None)
                  if latest:
                      wanted.append(".".join(map(str, latest)))
          print("versions=" + json.dumps(wanted))
          EOF

  live:
    needs: versions
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        geoserver: ${{ fromJSON(needs.versions.outputs.versions) }}

    name: "GeoServer ${{ matrix.geoserver }}"

    container:
      image: qgis/qgis:stable
      env:
        PYTHONPATH: "/usr/share/qgis/python/plugins:/usr/share/qgis/python:."
        QT_QPA_PLATFORM: "offscreen"
      volumes:
        - ${{ github.workspace }}:/home/root/

    services:
      geoserver:
        image: docker.osgeo.org/geoserver:${{ matrix.geoserver }}
        env:
          GEOSERVER_ADMIN_USER: admin
          GEOSERVER_ADMIN_PASSWORD: geoserver
          SKIP_DEMO_DATA: "false"
        # the job starts once the REST API answers
        options: >-
          --health-cmd "curl -fsS -u admin:geoserver http://localhost:8080/geoserver/rest/about/version.json"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 60s

      # the datastore steps connect GeoServer to it as host "postgis"
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: geoserver
          POSTGRES_USER: geoserver
          POSTGRES_PASSWORD: geoserver
        options: >-
          --health-cmd "pg_isready -U geoserver -d geoserver"
          --health-interval 5s
          --health-retries 20

    steps:
      # Without git, checkout downloads an archive without the .ts files.
      - name: Install git
        run: command -v git || (apt-get update && apt-get install -y git)

      - name: Get source code
        uses: actions/checkout@v7

      - name: Install Python requirements
        run: |
          apt update && apt install -y python3-pip python3-venv pipx
          cd /home/root/
          pipx run qgis-venv-creator --venv-name ".venv"
          . .venv/bin/activate
          python3 -m pip install -U -r requirements/testing.txt

      - name: Run the live suite
        env:
          GSM_LIVE_URL: "http://geoserver:8080/geoserver"
        run: |
          cd /home/root/
          . .venv/bin/activate
          xvfb-run python3 -m pytest -v tests/qgis/test_live_geoserver.py

  cloud-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.pick.outputs.versions }}

    steps:
      - name: Pick the GeoServer Cloud versions
        id: pick
        env:
          WANTED: ${{ inputs.cloud_versions }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, re, urllib.request

          wanted = os.environ.get("WANTED", "").split()
          if not wanted:
              request = urllib.request.Request(
                  "https://api.github.com/repos/geoserver/geoserver-cloud/releases?per_page=100",
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"]},
              )
              with urllib.request.urlopen(request, timeout=60) as answer:
                  releases = json.load(answer)
              tags = [
                  release["tag_name"][1:]
                  for release in releases
                  if not release["prerelease"]
                  and re.fullmatch(r"v\d+(\.\d+)+", release["tag_name"])
              ]
              number = lambda tag: tuple(map(int, tag.split(".")))
              # A major without a release (or no more) shrinks the matrix.
              wanted = []
              for major in (2, 3):
                  latest = max(
                      (tag for tag in tags if number(tag)[0] == major),
                      key=number,
                      default=None,
                  )
                  if latest:
                      wanted.append(latest)
          print("versions=" + json.dumps(wanted))
          EOF

  cloud:
    needs: cloud-versions
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        cloud: ${{ fromJSON(needs.cloud-versions.outputs.versions) }}
        catalog: [datadir, pgconfig]

    name: "GeoServer Cloud ${{ matrix.cloud }} (${{ matrix.catalog }})"

    steps:
      - name: Get source code
        uses: actions/checkout@v7

      # Cloud's own compose files, its stack, a PostGIS and the suite in a
      # QGIS container: all in one script, to run the same way by hand.
      - name: Run the live suite
        env:
          VERSION: ${{ matrix.cloud }}
          CATALOG: ${{ matrix.catalog }}
        run: .github/cloud/run_live.sh "$VERSION" "$CATALOG"
