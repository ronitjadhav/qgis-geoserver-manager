name: "✅ Linter"

on:
  # development.txt is what this job installs, and the workflow file pins the
  # actions it runs with: a bump to either has to be linted by this job, or it
  # reaches main with nothing having checked it.
  push:
    branches:
      - main
    paths:
      - '**.py'
      - .github/workflows/linter.yml
      - requirements/development.txt

  pull_request:
    branches:
      - main
    paths:
      - '**.py'
      - .github/workflows/linter.yml
      - requirements/development.txt

  # a run by hand, for a push the path filters skipped
  workflow_dispatch:

env:
  PROJECT_FOLDER: "geoserver_manager"
  PYTHON_VERSION: "3.12"


jobs:
  lint-py:
    name: Python 🐍

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Get source code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          cache: "pip"
          cache-dependency-path: "requirements/development.txt"
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install project requirements
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -U -r requirements/development.txt

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 ${{ env.PROJECT_FOLDER }} --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings.
          flake8 ${{ env.PROJECT_FOLDER }} --count --exit-zero --statistics

      - name: Refuse what plugins.qgis.org blocks
        # The site's Bandit rules that an upload cannot skip: one finding blocks
        # the version, and only a new version number can replace it.
        # A false positive takes "# nosec <rule>" on its line.
        run: |
          python -m pip install bandit
          bandit -r ${{ env.PROJECT_FOLDER }} -q -t B102,B103,B105,B106,B107,B201,B202,B301,B302,B304,B305,B306,B307,B312,B321,B323,B401,B402,B412,B413,B501,B502,B503,B505,B506,B507,B601,B602,B604,B605,B609,B610,B611,B612,B613,B615,B701

  qt6-check:
    name: PyQt6 6️⃣
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/oslandia/qgis/pyqgis-4-checker/pyqgis-qt-checker:latest
      volumes:
        - /tmp/.X11-unix:/tmp/.X11-unix
        - ${{ github.workspace }}:/home/pyqgisdev/
      options: --user root
    steps:
      - name: Get source code
        uses: actions/checkout@v7

      - name: Check PyQt5 to PyQt6 compatibility.
        run: |
          pyqt5_to_pyqt6.py --dry_run ${{ env.PROJECT_FOLDER }}/
          pyqt5_to_pyqt6.py --logfile pyqt6_checker.log ${{ env.PROJECT_FOLDER }}/

      - name: Upload script report if script fails
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: pyqt6-checker-error-report
          path: pyqt6_checker.log
          retention-days: 7
