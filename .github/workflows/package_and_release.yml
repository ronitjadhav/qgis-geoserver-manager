name: "📦 Package & 🚀 Release"

env:
  PROJECT_FOLDER: geoserver_manager
  # qgis-plugin-ci >= 2.10 requires Python >= 3.10
  PYTHON_VERSION: "3.12"

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/package_and_release.yml
      - 'docs/**/*'
      # the zip is this whole folder, translations included
      - "geoserver_manager/**"
      - requirements/packaging.txt
      - setup.cfg
    tags:
      - "*"
  # The packaging job must run on PRs too: a dependency bump once broke it and
  # only surfaced after merge because this workflow never saw the PR.
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/package_and_release.yml
      - 'docs/**/*'
      - "geoserver_manager/**"
      - requirements/packaging.txt
      - setup.cfg

# Allow one concurrent deployment per branch/pr

  # a run by hand, for a push the path filters skipped
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  translation:
    name: "💬 i18n compilation"
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install translation requirements
        run: |
          sudo apt update
          sudo apt install qttools5-dev-tools
          # pylupdate6, never pylupdate5: that one drops the strings black wraps
          python3 -m pip install -U PyQt6

      - name: Update translations
        run: python3 scripts/update_translations.py

      - name: Compile translations
        run: lrelease ${{ env.PROJECT_FOLDER }}/resources/i18n/*.ts

      - uses: actions/upload-artifact@v7
        with:
          name: translations-build
          path: ${{ env.PROJECT_FOLDER }}/**/*.qm
          if-no-files-found: error

  # -- NO TAGS ----------------------------------------------------------------------
  packaging:
    name: "📦 Packaging plugin"
    runs-on: ubuntu-latest
    needs:
      - translation

    if: ${{ !startsWith(github.ref, 'refs/tags/') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # the whole history, for the commit count in the version
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          cache: "pip"
          cache-dependency-path: "requirements/packaging.txt"
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -U -r requirements/packaging.txt

      - name: Download translations
        uses: actions/download-artifact@v8
        with:
          name: translations-build
          path: ${{ env.PROJECT_FOLDER }}

      - name: Amend gitignore to include compiled translations and add it to tracked files
        run: |
          # include compiled translations
          sed -i "s|^*.qm.*| |" .gitignore

          # git add full project
          git add ${{ env.PROJECT_FOLDER }}/

      - name: Package the development version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 0.1.0.<commit count>, so QGIS offers each build as an update (not SemVer: --no-validation)
        run: |
          version="$(sed -n 's/^version=//p' ${{ env.PROJECT_FOLDER }}/metadata.txt).$(git rev-list --count HEAD)"
          qgis-plugin-ci --no-validation package "$version" \
            --allow-uncommitted-changes \
            --plugin-repo-url "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.html_url')"

      - name: Refuse a bloated archive
        # The bundled geoservercloud wheel is stripped to ~50 KB; an unstripped
        # re-download is 16 MB and would ship to every user.
        run: |
          size=$(stat -c%s ${{ env.PROJECT_FOLDER }}.*.zip)
          echo "plugin zip: ${size} bytes"
          test "$size" -lt 1000000

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PROJECT_FOLDER }}-latest
          path: |
            plugins.xml
            ${{ env.PROJECT_FOLDER }}.*.zip
          if-no-files-found: error

  # -- ONLY TAGS ----------------------------------------------------------------------
  release:
    name: "🚀 Release on tag"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - translation

    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          cache: "pip"
          cache-dependency-path: "requirements/packaging.txt"
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install project requirements
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -U -r requirements/packaging.txt

      - name: Download translations
        uses: actions/download-artifact@v8
        with:
          name: translations-build
          path: ${{ env.PROJECT_FOLDER }}

      - name: Amend gitignore to include compiled translations and add it to tracked files
        run: |
          # include compiled translations
          sed -i "s|^*.qm.*| |" .gitignore

          # git add full project
          git add ${{ env.PROJECT_FOLDER }}/

      - name: Refuse a bloated archive
        # the packaging job's guard, which a tag skips, before anything is published
        run: |
          qgis-plugin-ci package "${GITHUB_REF/refs\/tags\//}" --allow-uncommitted-changes
          size=$(stat -c%s ${{ env.PROJECT_FOLDER }}.*.zip)
          echo "plugin zip: ${size} bytes"
          test "$size" -lt 1000000
          rm ${{ env.PROJECT_FOLDER }}.*.zip
          # a package run unstages the compiled translations
          git add ${{ env.PROJECT_FOLDER }}/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Deploy plugin
        run: >-
          qgis-plugin-ci
          release ${GITHUB_REF/refs\/tags\//}
          --allow-uncommitted-changes
          --create-plugin-repo
          --github-token ${{ secrets.GITHUB_TOKEN }}
          --osgeo-username ${{ secrets.OSGEO_USER }}
          --osgeo-password ${{ secrets.OSGEO_PASSWORD }}
